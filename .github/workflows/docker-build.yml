name: Build & Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "clube-tamoios/clube-tamoios/**"
      - ".github/workflows/docker-build.yml"

jobs:
  build-and-push:
    name: Test, build and push backend image
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: clube-tamoios/clube-tamoios/pom.xml

      - name: Aguardar RabbitMQ ficar disponível
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5672) >/dev/null 2>&1; then
              echo "RabbitMQ está aceitando conexões TCP"
              exit 0
            fi
            sleep 2
          done
          echo "RabbitMQ não ficou disponível"
          exit 1

      - name: Executar testes Maven
        working-directory: clube-tamoios/clube-tamoios
        env:
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: test
          SPRING_RABBITMQ_PASSWORD: test
        run: mvn -B test

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: ./clube-tamoios/clube-tamoios
          push: true
          tags: pedrobarbosa996/arandu_digital:backend
