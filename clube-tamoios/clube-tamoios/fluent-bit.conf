[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    storage.path   /tmp/fluent-bit/storage

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    Tag           arandu.backend

[OUTPUT]
    Name          s3
    Match         arandu.backend
    region        us-east-1
    bucket        arandu-bronze-pedro-425226184328
    total_file_size 10M
    upload_timeout 1m
    format        json_lines
    store_dir     /tmp/fluent-bit/s3
    s3_key_format /logs/%Y/%m/%d/backend_log_%H-%M-%S-$UUID.json
