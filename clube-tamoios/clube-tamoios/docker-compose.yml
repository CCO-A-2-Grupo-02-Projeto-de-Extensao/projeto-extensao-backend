services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arandu-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_STORAGE_TYPE: ${APP_STORAGE_TYPE:-s3}
      APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET}
      APP_STORAGE_S3_REGION: ${APP_STORAGE_S3_REGION:-us-east-1}
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        fluentd-async-connect: "true"
        tag: arandu.backend

  fluent-bit:
    image: public.ecr.aws/aws-observability/aws-for-fluent-bit:latest
    container_name: arandu-fluent-bit
    restart: unless-stopped
    ports:
      - "24224:24224"
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /tmp/fluent-bit:/tmp/fluent-bit
      - /root/.aws:/root/.aws:ro
    environment:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_PROFILE: default
    command: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
