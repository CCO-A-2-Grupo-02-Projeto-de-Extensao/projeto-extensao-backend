spring.application.name=clube-tamoios

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# Valores abaixo são o padrão de desenvolvimento local; em produção todos são
# sobrescritos pelas variáveis de ambiente injetadas no container.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/clube_tamoios?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:7425}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080


spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:123}

# Armazenamento de documentos: banco | local | s3
app.storage.type=${APP_STORAGE_TYPE:banco}
app.storage.local.path=${APP_STORAGE_LOCAL_PATH:uploads}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:}
app.storage.s3.region=${APP_STORAGE_S3_REGION:us-east-1}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Executa data.sql automaticamente após o Hibernate criar/atualizar as tabelas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Swagger UI — respeita a ordem definida no SwaggerConfig
springdoc.swagger-ui.tags-sorter=
springdoc.swagger-ui.operations-sorter=